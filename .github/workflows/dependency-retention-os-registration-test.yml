name: Dependency retention CLOSED registration TEST

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Owned TEST registration topology, never Active qualification"
        type: choice
        options: [qualification, current-adoptable-backing]
        default: qualification
  pull_request:
    paths:
      - 'scripts/dependency-retention-os-test/**'
      - '.github/workflows/dependency-retention-os-registration-test.yml'
      - 'src/**/dependency-environment/**'
      - 'src/**/hosted-dependency-*.ts'
      - 'src/worker-codex/hosted-installation-*.ts'
      - 'src/worker-codex/hosted-readonly-*.ts'
      - 'src/worker-codex/hosted-test-egress-*.ts'
      - 'src/worker-codex/hosted-full-backing-*.ts'
      - 'host-integration/managed-launcher/**'
      - 'src/provider-codex/app-server/adapters/hosted-*.ts'
      - 'src/provider-codex/app-server/adapters/system-bus-infrastructure.ts'
      - 'src/core/host-infrastructure/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'

permissions:
  contents: read

jobs:
  owned-closed-registration:
    # One fresh disposable GitHub VM. No worker/user host or existing service.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Typecheck fixed current9ca PUBLIC stage proposal without execution
        run: node node_modules/typescript/bin/tsc --project scripts/dependency-retention-os-test/tsconfig.public-stage-caller-9ca.json
      - name: Typecheck fixed PUBLIC transport bootstrap without execution
        run: node node_modules/typescript/bin/tsc --project scripts/dependency-retention-os-test/tsconfig.public-stage-transport-9ca.json
      - run: npm run build
      - name: Typecheck the retained handwritten OS fixture closure
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.json
      - name: Prove completed-removal idle replay on root Linux, exact old red and new green
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          TEST_NODE="$(readlink -f "$(command -v node)")"
          sudo env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            "$TEST_NODE" --experimental-strip-types \
            "$GITHUB_WORKSPACE/scripts/dependency-retention-os-test/completed-removal-retry-ci.ts" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$TEST_SOURCE_SHA"
      - name: Retain completed-removal focused Linux regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-completed-removal-retry-${{ github.event.pull_request.head.sha || github.sha }}
          path: dependency-completed-removal-retry-evidence.json
          if-no-files-found: error
      - name: Emit finite TEST catalog before composition, copy and digest
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.catalog-emit.json
      - name: Emit finite registration closure before owned root copy and digest
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.registration-emit.json
      - name: Emit finite fresh current ROOT setup closure without activation
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.current-cold-hot-emit.json
      - name: Check exact current idle source closure reconciliation
        run: node --test scripts/dependency-retention-os-test/current-closed-entry.node-test.js
      - name: Emit finite reviewed public Codex TEST input helpers
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.current-real-codex-emit.json
      - name: Emit finite future FULL TEST caller without auth or activation
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.current-full-emit.json
      - name: Check finite H1 supervisor readiness and one-shot continuation
        run: node --test scripts/dependency-retention-os-test/current-full-h1-supervision.node-test.js scripts/dependency-retention-os-test/current-removal-h1-fixture.node-test.js
      - name: Check retained image descriptor and backing mount observation contracts
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test scripts/dependency-retention-os-test/current-full-backing-collector.node-test.js
      - name: Execute real foreign process and FD census completion TEST
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test scripts/dependency-retention-os-test/current-full-backing-interval.node-test.js
      - name: Strict emit reviewed eviction and restore TEST closure without effects
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.current-evict-restore-emit.json
      - name: Compile finite uninstalled ROOT profile and check refusal DATA only
        run: |
          node node_modules/typescript/bin/tsc -p host-integration/managed-launcher/tsconfig.dependency-full-native-test.json
          node --test host-integration/managed-launcher/dependency-full-native-TEST.node-test.js
      - name: Retain finite public compiled profile delivery inputs
        uses: actions/upload-artifact@v4
        with:
          name: dependency-full-profile-public-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            host-integration/managed-launcher/dependency-full-native-TEST.js
            host-integration/managed-launcher/dependency-full-native-parent-TEST.js
            scripts/dependency-retention-os-test/current-full-outer.js
            scripts/dependency-retention-os-test/current-full-monitor-native-TEST.js
            scripts/dependency-retention-os-test/current-full-backing-collector.js
            scripts/dependency-retention-os-test/current-administrative-installation.js
            scripts/dependency-retention-os-test/administrative-test-control.js
            scripts/dependency-retention-os-test/administrative-installation-native-TEST.js
            scripts/dependency-retention-os-test/administrative-maintenance-native-TEST.js
            scripts/dependency-retention-os-test/administrative-forgery-native-TEST.js
            scripts/dependency-retention-os-test/current-full-backing-interval.node-test.js
            src/worker-codex/hosted-full-backing-proc.js
            host-integration/managed-launcher/launch.mjs
            host-integration/managed-launcher/profiles.mjs
            host-integration/managed-launcher/payload-guard.mjs

          ]);
          const total = expected.size;
          const lines = readFileSync(process.env.TAP!, 'utf8').trimEnd().split(/\r?\n/);
          assert.deepEqual(lines.filter(line => line === 'TAP version 13'), ['TAP version 13']);
          assert.deepEqual(lines.filter(line => /^1\.\./.test(line)), [`1..${total}`]);

  crash-boundary-shards:
    if: ${{ always() && !cancelled() && !(needs.ci-proof-reuse.result == 'success' && needs.ci-proof-reuse.outputs.reuse_crash == 'true') }}
    needs: [ci-proof-reuse]
    permissions:
      contents: read
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        lane: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch scrubbed public legacy ledger fixture
        run: git fetch --no-tags --depth=1 origin 7d6d19a096f2cd0e3772f8369e6e09034c8b4280
      - name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: *node_linux_prerequisite_script
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
          cache: npm
      - name: Prepare CI proof helper with locked project TypeScript
        run: |
          for i in 1 2 3; do npm ci --ignore-scripts && break; [ $i -eq 3 ] && exit 1; sleep 10; done
          npm run build:ci-proof-reuse -- --outDir "$RUNNER_TEMP/ci-proof-helper"
      - name: Capture CI proof identity before source execution
        id: capture
        continue-on-error: true
        env:
          CI_PROOF_RUNNER_LABEL: ${{ vars.RUNNER || 'ubuntu-24.04' }}
          CI_PROOF_FAMILY: crash
          CI_PROOF_LANE: ${{ matrix.lane }}
          CI_PROOF_RECEIPT_PATH: ${{ runner.temp }}/ci-proof-crash-${{ matrix.lane }}/receipt.json
        run: node "$RUNNER_TEMP/ci-proof-helper/cli.mjs" capture
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run build:packages
      - name: Certify crash-boundary shards in lane ${{ matrix.lane }}
        env:
          CODEX_LEDGER_EPOCH_CRASH_RANGE_ONLY: "1"
          SHARD_LANE: ${{ matrix.lane }}
        run: |
          npm run test:crash-lane -- "$SHARD_LANE"
      - name: Publish successful CI lane proof
        continue-on-error: true
        if: ${{ success() && steps.capture.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-proof-v1-${{ github.run_attempt }}-crash-${{ matrix.lane }}
          path: ${{ runner.temp }}/ci-proof-crash-${{ matrix.lane }}/receipt.json
          if-no-files-found: error
          retention-days: 2

  crash-boundary-shards-complete:
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [ci-proof-reuse, crash-boundary-shards]
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Verify every crash-boundary shard lane passed
        env:
          CRASH_BOUNDARY_SHARDS_RESULT: ${{ needs.crash-boundary-shards.result }}
          CI_PROOF_RESULT: ${{ needs.ci-proof-reuse.result }}
          REUSE_CRASH: ${{ needs.ci-proof-reuse.outputs.reuse_crash }}
        run: |
          set -euo pipefail
          if [ "$CRASH_BOUNDARY_SHARDS_RESULT" = success ]; then
            echo "All eight crash lanes executed successfully."
          elif [ "$CRASH_BOUNDARY_SHARDS_RESULT" = skipped ] &&
               [ "$CI_PROOF_RESULT" = success ] && [ "$REUSE_CRASH" = true ]; then
            echo "All eight crash lanes verified from exact-tree PR proofs."
          else
            echo "::error::Crash lane execution or verified proof is missing"
            exit 1
          fi

  test:
    if: ${{ always() }}
    needs: [quality, unit-tests, observer-mount-tests, archive-root-tests, package, native-probe-source, crash-boundary-shards-complete]
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Verify all CI gates passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          OBSERVER_MOUNT_RESULT: ${{ needs.observer-mount-tests.result }}
          ARCHIVE_ROOT_TESTS_RESULT: ${{ needs.archive-root-tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          NATIVE_PROBE_SOURCE_RESULT: ${{ needs.native-probe-source.result }}
          CRASH_BOUNDARY_SHARDS_RESULT: ${{ needs.crash-boundary-shards-complete.result }}
        run: |
          if [ "$QUALITY_RESULT" = "success" ] && \
             [ "$UNIT_TESTS_RESULT" = "success" ] && \
             [ "$OBSERVER_MOUNT_RESULT" = "success" ] && \
             [ "$ARCHIVE_ROOT_TESTS_RESULT" = "success" ] && \
             [ "$PACKAGE_RESULT" = "success" ] && \
             [ "$NATIVE_PROBE_SOURCE_RESULT" = "success" ] && \
             [ "$CRASH_BOUNDARY_SHARDS_RESULT" = "success" ]; then
            exit 0
          fi

          echo "quality: $QUALITY_RESULT"
          echo "unit-tests: $UNIT_TESTS_RESULT"
          echo "observer-mount-tests: $OBSERVER_MOUNT_RESULT"
          echo "archive-root-tests: $ARCHIVE_ROOT_TESTS_RESULT"
          echo "package: $PACKAGE_RESULT"
          echo "native-probe-source: $NATIVE_PROBE_SOURCE_RESULT"
          echo "crash-boundary-shards-complete: $CRASH_BOUNDARY_SHARDS_RESULT"
          exit 1

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-h1-controlled-build') && format('-controlled-h1-{0}', github.event.pull_request.head.sha) || '' }}
  cancel-in-progress: true

# Source/test gates use the configured RUNNER pool. Metadata-only proof checks
# and result aggregation use the independent CI_CONTROL_RUNNER pool.
jobs:
  ci-proof-reuse:
    # Only trusted main-push code reads prior PR artifacts/logs. PRs run every lane.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      reuse_unit: ${{ steps.proof.outputs.reuse_unit }}
      reuse_crash: ${{ steps.proof.outputs.reuse_crash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: &node_linux_prerequisite_script |
          set -euo pipefail
          # The official Linux Node.js binary needs libatomic.so.1 before setup-node can run it.
          have_libatomic() { grep -q 'libatomic\.so\.1 ' < <(/sbin/ldconfig -p 2>/dev/null); }
          if have_libatomic; then exit 0; fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::libatomic.so.1 is missing and this Linux runner has no apt-get"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
          have_libatomic
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
      - name: Install encrypted checkpoint restore test dependency
        run: |
          if ! command -v restic >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends restic
          fi
          restic version
      # The helper uses strict enums, which Node cannot execute directly. Compile
      # it with the lock-pinned project TypeScript; no lifecycle scripts run.
      - name: Prepare CI proof helper with locked project TypeScript
        run: |
          for i in 1 2 3; do npm ci --ignore-scripts && break; [ $i -eq 3 ] && exit 1; sleep 10; done
          npm run build:ci-proof-reuse -- --outDir "$RUNNER_TEMP/ci-proof-helper"
      - name: Verify reusable PR lane proofs
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PROOF_RUNNER_LABEL: ${{ vars.RUNNER || 'ubuntu-24.04' }}
        run: node "$RUNNER_TEMP/ci-proof-helper/cli.mjs" detect

  quality:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: *node_linux_prerequisite_script
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
          cache: npm
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      # Source facades require this exact revision's canonical emitted leaves.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck:ci-tools
      - run: npm run test:ci-tools
      - name: Verify fresh staging checks on CI Node version
        run: node --test scripts/dependency-retention-os-test/current-positive-fresh-check.node-test.mts
      - run: npm run check:dist
      - run: npm run check:boundaries
      - name: Select exact HOST Node version for finite staging checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Verify fresh staging checks on exact HOST Node version
        env:
          TEST_C_FRESH_CHECK_EXACT_NODE24: "1"
        run: node --test scripts/dependency-retention-os-test/current-positive-fresh-check.node-test.mts

  unit-test-shards:
    if: ${{ always() && !cancelled() && !(needs.ci-proof-reuse.result == 'success' && needs.ci-proof-reuse.outputs.reuse_unit == 'true') }}
    needs: [ci-proof-reuse]
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - &unit_test_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch scrubbed public legacy ledger fixture
        run: git fetch --no-tags --depth=1 origin 7d6d19a096f2cd0e3772f8369e6e09034c8b4280
      - &unit_test_node_prerequisite
        name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: *node_linux_prerequisite_script
      - &unit_test_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
          cache: npm
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - name: Install encrypted checkpoint restore test dependency
        run: |
          if ! command -v restic >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends restic
          fi
          restic version
      - name: Prepare CI proof helper with locked project TypeScript
        run: |
          for i in 1 2 3; do npm ci --ignore-scripts && break; [ $i -eq 3 ] && exit 1; sleep 10; done
          npm run build:ci-proof-reuse -- --outDir "$RUNNER_TEMP/ci-proof-helper"
      - name: Capture CI proof identity before source execution
        id: capture
        continue-on-error: true
        env:
          CI_PROOF_RUNNER_LABEL: ${{ vars.RUNNER || 'ubuntu-24.04' }}
          CI_PROOF_FAMILY: unit
          CI_PROOF_LANE: ${{ matrix.shard }}
          CI_PROOF_RECEIPT_PATH: ${{ runner.temp }}/ci-proof-unit-${{ matrix.shard }}/receipt.json
        run: node "$RUNNER_TEMP/ci-proof-helper/cli.mjs" capture
      - &unit_test_install
        run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - name: Run unit shard in a private TEST home
        shell: bash
        run: &private_test_home |
          set -euo pipefail
          # ARC's /home/runner is shared-writable. Allocate new TEST inventory
          # directly beneath /home; never chmod/adopt the existing runner HOME.
          for subscription_test_parent in / /home; do
            test -d "$subscription_test_parent" && test ! -L "$subscription_test_parent"
            test "$(readlink -f -- "$subscription_test_parent")" = "$subscription_test_parent"
            subscription_test_parent_mode=$(stat -c '%a' -- "$subscription_test_parent")
            (( (8#$subscription_test_parent_mode & 022) == 0 ))
          done
          subscription_test_home=$(sudo -n mktemp -d /home/subscription-ci-TEST-XXXXXX)
          subscription_test_home_identity=$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")
          cleanup_subscription_test_home() {
            local subscription_test_original_status=$?
            local subscription_test_cleanup_status=0
            if [[ "$subscription_test_home" =~ ^/home/subscription-ci-TEST-[[:alnum:]]{6}$ ]] &&
              [[ "$subscription_test_home_identity" == *:700 ]] &&
              test -d "$subscription_test_home" && test ! -L "$subscription_test_home" &&
              test "$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")" = "$subscription_test_home_identity"; then
              # Clear children without privilege. /home is root-owned, so only
              # unlinking the empty acquired HOME requires elevated rmdir.
              find "$subscription_test_home" -xdev -depth -mindepth 1 -delete || subscription_test_cleanup_status=$?
              if test -d "$subscription_test_home" && test ! -L "$subscription_test_home" &&
                test "$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")" = "$subscription_test_home_identity"; then
                sudo -n rmdir -- "$subscription_test_home" || subscription_test_cleanup_status=$?
              else
                echo "::error::Private TEST home identity changed after clearing children; cleanup refused"
                subscription_test_cleanup_status=1
              fi
            else
              echo "::error::Private TEST home identity changed; cleanup refused"
              subscription_test_cleanup_status=1
            fi
            if (( subscription_test_original_status != 0 )); then exit "$subscription_test_original_status"; fi
            exit "$subscription_test_cleanup_status"
          }
          trap cleanup_subscription_test_home EXIT
          sudo -n chown "$(id -u):$(id -g)" "$subscription_test_home"
          subscription_test_home_identity=$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")
          test "$(stat -c '%u:%g:%a' -- "$subscription_test_home")" = "$(id -u):$(id -g):700"
          export HOME="$subscription_test_home"
          case "$CI_TEST_TARGET" in
            1/4|2/4|3/4|4/4)
              # Every shard needs dist fixtures and the configured two forks.
              # The six original placement cases run in the required Root TEST
              # selection below; they cannot authenticate Root in this lane.
              npm run build
              if npm run test:unit -- --shard="$CI_TEST_TARGET" --exclude=src/worker-codex/tests/hosted-original-usable-placement-installation.test.ts; then
                :
              else
                subscription_original_unit_status=$?
                if [[ "$CI_TEST_TARGET" == "2/4" ]]; then
                  subscription_lifecycle_diag_root="$RUNNER_TEMP/subscription-unit2-SOURCE-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  # Observe only in a disposable source copy, before private HOME cleanup.
                  # Preserve the original unit failure even on diagnostic error/timeout.
                  if /usr/bin/timeout --signal=TERM --kill-after=10s 300s node scripts/ci-source-diagnostics/diagnose-unit2-lifecycle.mts "$GITHUB_WORKSPACE" "$subscription_lifecycle_diag_root"; then
                    :
                  else
                    :
                  fi
                fi
                exit "$subscription_original_unit_status"
              fi
              ;;
            ancillary)
              npm run test:before-unit
              npm run test:after-unit
              ;;
            *)
              echo "::error::Unknown CI test target"
              exit 1
              ;;
          esac
        env:
          CI_TEST_TARGET: ${{ matrix.shard }}/4
          SR_ARCHIVE_TEST_PRIVILEGE: nonroot
      - name: Retain failure-only Unit 2 SOURCE diagnosis
        if: ${{ failure() && matrix.shard == 2 }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit2-lifecycle-SOURCE-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/subscription-unit2-SOURCE-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/evidence/manifest.json
            ${{ runner.temp }}/subscription-unit2-SOURCE-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/evidence/events.jsonl
            ${{ runner.temp }}/subscription-unit2-SOURCE-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/evidence/summary.json
          if-no-files-found: warn
          retention-days: 2
      - name: Publish successful CI lane proof
        continue-on-error: true
        if: ${{ success() && steps.capture.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-proof-v1-${{ github.run_attempt }}-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-proof-unit-${{ matrix.shard }}/receipt.json
          if-no-files-found: error
          retention-days: 2

  unit-test-ancillary:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - *unit_test_checkout
      - *unit_test_node_prerequisite
      - *unit_test_node
      - *unit_test_install
      - name: Run non-Vitest test phases once in a private TEST home
        shell: bash
        run: *private_test_home
        env:
          CI_TEST_TARGET: ancillary
          SR_ARCHIVE_TEST_PRIVILEGE: nonroot

  unit-tests:
    if: ${{ always() }}
    needs: [ci-proof-reuse, unit-test-shards, unit-test-ancillary]
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Require all four unit shards and ancillary phases
        env:
          UNIT_TEST_SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
          UNIT_TEST_ANCILLARY_RESULT: ${{ needs.unit-test-ancillary.result }}
          CI_PROOF_RESULT: ${{ needs.ci-proof-reuse.result }}
          REUSE_UNIT: ${{ needs.ci-proof-reuse.outputs.reuse_unit }}
        run: |
          set -euo pipefail
          test "$UNIT_TEST_ANCILLARY_RESULT" = success
          if [ "$UNIT_TEST_SHARDS_RESULT" = success ]; then
            echo "All four unit shards executed successfully; ancillary phases passed."
          elif [ "$UNIT_TEST_SHARDS_RESULT" = skipped ] &&
               [ "$CI_PROOF_RESULT" = success ] && [ "$REUSE_UNIT" = true ]; then
            echo "All four unit shards verified from exact-tree PR proofs; ancillary phases passed."
          else
            echo "::error::Unit shard execution or verified proof is missing"
            exit 1
          fi

  archive-root-tests:
    # The unchanged archive TEST runs as native UID 0 in the existing disposable
    # SOURCE container. Its command and completed JSON report are mandatory there.
    needs: native-probe-source
    if: ${{ always() }}
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Require completed SOURCE and native root archive TEST container
        env:
          NATIVE_SOURCE_RESULT: ${{ needs.native-probe-source.result }}
        run: test "$NATIVE_SOURCE_RESULT" = success

  observer-mount-tests:
    # This native mount gate requires the stock Ubuntu VM namespace contract.
    # Keep the shared ARC runner and its security policy unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: *node_linux_prerequisite_script
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
          cache: npm
      - name: Require genuine runner identity and disposable namespace capabilities
        shell: bash
        run: |
          set -euo pipefail
          id
          cat /etc/os-release
          node --version
          cat /proc/self/uid_map
          wc -c /proc/self/mountinfo
          readlink /proc/self/ns/user /proc/self/ns/mnt /proc/self/ns/pid
          test "$(id -u)" -gt 0
          test "$(id -g)" -gt 0
          test "$(stat -c %u -- "$GITHUB_WORKSPACE")" = "$(id -u)"
          grep -q '^VERSION_ID="24\.04"$' /etc/os-release
          node -e 'if (process.versions.node !== "26.11.1") process.exit(1)'
          sudo -n -l
          sudo -n /usr/bin/timeout --signal=TERM --kill-after=5s 30s \
            /usr/bin/unshare --user --map-root-user --mount --pid --fork \
            --mount-proc --propagation private --kill-child=SIGKILL -- /bin/true
      - name: Fetch locked TEST dependencies
        run: for i in 1 2 3; do npm ci --ignore-scripts && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run build:packages
      # Source facades need this exact tree's emitted HOST contracts before strict typechecking.
      - run: npm run build:host-source-contracts
      - name: Typecheck scratch preparation and the native TEST helper
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
          node node_modules/typescript/bin/tsc -p scripts/test-scratch-mount-propagation.tsconfig.json
      - name: Require scratch preparation and adjacent research contracts
        run: |
          npm run build
          node node_modules/vitest/vitest.mjs run --maxWorkers=1 \
            src/worker-codex/tests/host-scratch-temp.test.ts \
            src/worker-codex/tests/host-scratch-mount.test.ts \
            src/worker-codex/tests/host-scratch-mount-observation-cost.test.ts \
            src/worker-codex/tests/research-provider-service.test.ts \
            src/worker-codex/tests/research-provider-root.test.ts \
            src/worker-codex/tests/research-launch-diagnostics.test.ts \
            src/worker-codex/tests/research-launch-diagnostics-privacy.test.ts
      - name: Require real shared-source leaf isolation in a fresh TEST namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir scratch-mount-evidence
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=5s 30s \
            /usr/bin/unshare --mount --propagation private \
            "$(command -v node)" --experimental-strip-types scripts/test-scratch-mount-propagation.mts \
            | tee scratch-mount-evidence/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: scratch-mount-propagation-evidence
          path: scratch-mount-evidence/result.json
          if-no-files-found: error
          retention-days: 7
      - name: Typecheck the focused namespace helper
        run: node node_modules/typescript/bin/tsc -p scripts/test-dependency-observer-mount-namespace.tsconfig.json
      - name: Require actual observer mount negatives and FD-close oracle
        env:
          TEST_SOURCE_SHA: ${{ github.sha }}
        run: |
          sudo -n --preserve-env=CI,GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_TEMP,TEST_SOURCE_SHA \
            "$(command -v node)" --experimental-strip-types scripts/test-dependency-observer-mount-namespace.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: observer-mount-evidence
          path: observer-mount-evidence/result.json
          if-no-files-found: error
          retention-days: 7

  package:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: *node_linux_prerequisite_script
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
          cache: npm
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run check:packed-consumer -- --retain-validated-tarball
      - name: Upload the same validated public runtime package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-runtime-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: vioxen-subscription-runtime-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Strict emit Python envelope filesystem TEST in existing package job
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p dependency-python-envelope-package-root-evidence
          printf '{"schemaVersion":1,"sourceSha":"%s","purpose":"package-job-four-root-filesystem-TEST-not-native-qualification"}\n' "$TEST_SOURCE_SHA" > dependency-python-envelope-package-root-evidence/source.json
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE_SHA"
          node --version > dependency-python-envelope-package-root-evidence/node-version.txt
          node node_modules/typescript/bin/tsc --version > dependency-python-envelope-package-root-evidence/typescript-version.txt
          grep -Fxq 'Version 6.0.3' dependency-python-envelope-package-root-evidence/typescript-version.txt
          sha256sum \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.ts \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.ts \
            scripts/dependency-retention-os-test/current-full-python-envelope-catalog.ts \
            scripts/dependency-retention-os-test/tsconfig.python-envelope-emit.json \
            scripts/dependency-retention-os-test/assemble-current-full.ts \
            .github/workflows/dependency-retention-os-registration-test.yml \
            .github/workflows/ci.yml \
            > dependency-python-envelope-package-root-evidence/source.sha256
          node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.python-envelope-emit.json 2>&1 | tee dependency-python-envelope-package-root-evidence/strict-emit.log
          sha256sum \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.js \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.js \
            scripts/dependency-retention-os-test/current-full-python-envelope-catalog.js \
            > dependency-python-envelope-package-root-evidence/emitted.sha256
      - name: Require four actual root Linux filesystem envelope scenarios on disposable CI runner
        run: |
          set -o pipefail
          TEST_NODE="$(readlink -f "$(command -v node)")"
          if [ "$(id -u)" -eq 0 ]; then
            env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" TEST_PYTHON_ENVELOPE_ROOT_CI=1 \
              "$TEST_NODE" --test --test-reporter=tap \
              "$GITHUB_WORKSPACE/host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.js"
          else
            sudo -n env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" TEST_PYTHON_ENVELOPE_ROOT_CI=1 \
              "$TEST_NODE" --test --test-reporter=tap \
              "$GITHUB_WORKSPACE/host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.js"
          fi 2>&1 | tee dependency-python-envelope-package-root-evidence/root-tests.tap
          TAP=dependency-python-envelope-package-root-evidence/root-tests.tap
          grep -Eq '^ok [0-9]+ - complete native census reconciles all candidates and refuses late unknown source/bytecode$' "$TAP"
          grep -Eq '^ok [0-9]+ - native complete EOF is mandatory at exact entry/byte limits and aliases cannot escape$' "$TAP"
          grep -Eq '^ok [0-9]+ - native candidate metadata refuses hardlinks and writable source even with matching content$' "$TAP"
          grep -Eq '^ok [0-9]+ - alias literal size participates in file bound and largest-file measurement$' "$TAP"
          grep -Eq '^ok [0-9]+ - ROOT fixed DATA census pins exact signed site target and excludes arbitrary etc content$' "$TAP"
          grep -Eq '^ok [0-9]+ - ROOT fixed DATA census refuses ancestor aliases unknown raw literals and wrong signed provider$' "$TAP"
          grep -Eq '^ok [0-9]+ - native census refuses caller-owned fixture before reading candidate content # SKIP root-owned positive census requires separate Linux integration$' "$TAP"
          grep -Fxq '# tests 21' "$TAP"
          grep -Fxq '# pass 20' "$TAP"
          grep -Fxq '# fail 0' "$TAP"
          grep -Fxq '# skipped 1' "$TAP"
          test "$(grep -c ' # SKIP ' "$TAP")" -eq 1
      - name: Retain package-job exact-source root filesystem TEST evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-python-envelope-package-root-${{ github.event.pull_request.head.sha || github.sha }}
          path: dependency-python-envelope-package-root-evidence/
          if-no-files-found: error

      - name: Strict emit fixed H1 signed DATA acquisition TEST and bind exact source
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p dependency-h1-tool-inputs-ci-source-evidence

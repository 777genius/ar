  h1-controlled-build:
    # Explicit TEST opt-in: remove the label after this exact run starts so
    # ordinary pushes never repeat the compiler build. Its source-specific
    # concurrency group also preserves this owned run during later PR pushes.
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-h1-controlled-build') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      TEST_H1_CONTROLLED_BUILD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: *node_linux_prerequisite_script
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.11.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare complete exact-source compiler TEST runtime
        id: compiler-runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE_SHA"
          owned=$(mktemp -d "$RUNNER_TEMP/TEST-H1-compiler-runtime-XXXXXX")
          evidence=dependency-h1-controlled-build-source-evidence
          mkdir -m 0700 "$evidence"
          printf 'root=%s\n' "$owned" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$evidence/source-commit.txt"
          git rev-parse HEAD^{tree} > "$evidence/source-tree.txt"
          git archive --format=tar HEAD | tar -xf - -C "$owned"
          # A new repository from public objects avoids copying operator Git
          # configuration or credentials into the disposable compiler.
          git bundle create "$owned/source.bundle" HEAD
          git -C "$owned" init --quiet
          git -C "$owned" fetch --quiet "$owned/source.bundle" HEAD
          git -C "$owned" reset --mixed "$TEST_SOURCE_SHA" >/dev/null
          test "$(git -C "$owned" rev-parse HEAD)" = "$TEST_SOURCE_SHA"
          node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.h1-tool-inputs-ci-emit.json --outDir "$owned"
          source_leaf=src/provider-codex/app-server/adapters/hosted-signed-tool-elf.js
          leaf=dist/provider-codex/app-server/adapters/hosted-signed-tool-elf.js
          mkdir -p "$owned/$(dirname "$leaf")"
          cp "$owned/$source_leaf" "$owned/$leaf"
          cmp "$owned/$source_leaf" "$owned/$leaf"
          find "$owned" -type f -name '*.js' -print0 | sort -z | xargs -0 sha256sum > "$evidence/emitted.sha256"
          node --test "$owned/scripts/dependency-retention-os-test/current-h1-controlled-build.node-test.js" > "$evidence/portable-tests.tap"
      - name: Build authenticated H1 inputs in the owned disposable container
        shell: bash
        env:
          H1_EMITTED_ROOT: ${{ steps.compiler-runtime.outputs.root }}
        run: |
          set -euo pipefail
          node "$H1_EMITTED_ROOT/scripts/dependency-retention-os-test/current-h1-controlled-build-docker-TEST.js" "$H1_EMITTED_ROOT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-h1-controlled-build-${{ github.event.pull_request.head.sha }}
          path: |
            dependency-h1-controlled-build-source-evidence/
            dependency-h1-controlled-build-docker-evidence/
          if-no-files-found: error
          compression-level: 1

  native-probe-source:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Keep JavaScript actions on the host runner. The TEST container receives
      # only a Git archive via Docker's API, never runner/auth/socket mounts.
      - name: Run disposable NativeProbe SOURCE container
        id: native
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          owned=$(mktemp -d "$RUNNER_TEMP/native-probe-source-TEST-XXXXXX")
          printf 'evidence=%s\n' "$owned" >> "$GITHUB_OUTPUT"
          name="native-probe-source-TEST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$name" > "$owned/container-name.txt"
          git rev-parse HEAD > "$owned/source-commit.txt"
          git rev-parse HEAD^{tree} > "$owned/source-tree.txt"
          git archive --format=tar HEAD > "$owned/source.tar"
          sha256sum "$owned/source.tar" > "$owned/source-archive.sha256"
          # Fixed disposable TEST profile; preserves upstream denials except
          # size88 clone3 needed for actual pidfd births. No host policy change.
          profile=host-integration/native-probe/ci-source-seccomp.json
          printf '%s  %s\n' '5589a5a9c0c4a09dc755d8d8af511905b513f94e2d15bb0b7d6cdd89b710e087' "$profile" | sha256sum --check --strict
          cp "$profile" "$owned/ci-source-seccomp.json"
          sha256sum "$owned/ci-source-seccomp.json" > "$owned/seccomp-profile.sha256"
          docker version --format '{{json .}}' > "$owned/docker-version.json"
          uname -srvm > "$owned/runner-kernel.txt"
          cat > "$owned/command.sh" <<'TEST_COMMAND'
          set -euo pipefail
          umask 077
          mkdir -p /native-probe-source-workspace/{source,tmp,home,cache}
          tar -xf /source.tar -C /native-probe-source-workspace/source
          cd /native-probe-source-workspace/source
          mkdir -p delivery/a0-native-probe
          # Archive fixtures observe a real isolated tmux socket, never a mocked absence.
          timeout --signal=TERM --kill-after=5s 90s apt-get update
          timeout --signal=TERM --kill-after=5s 90s apt-get install --yes --no-install-recommends tmux=3.3a-3
          dpkg-query --show --showformat='${Version}\n' tmux
          tmux -V
          npm ci
          # The HOST source facade imports canonical emitted runtime leaves.
          # Build this exact disposable source before its root-source check;
          # workspace-package declarations alone do not provide those leaves.
          npm run build
          npm run typecheck:native-probe
          sr_native_phase=root_typecheck_driver
          sr_native_phase_on_exit() {
            sr_native_phase_rc=$?
            trap - EXIT
            case "$sr_native_phase" in
              root_typecheck_driver|contracts_driver|root_tmpfs|root_principal|root_tests|root_validator_compile|root_validator)
                if [[ "$sr_native_phase_rc" =~ ^(0|[1-9][0-9]{0,2})$ ]] && (( sr_native_phase_rc <= 255 )); then
                  printf '\nSR_NATIVE_SOURCE_PHASE_V1 phase=%s exit=%s\n' "$sr_native_phase" "$sr_native_phase_rc" || true
                else
                  printf '\n%s\n' 'SR_NATIVE_SOURCE_PHASE_V1 phase=UNKNOWN exit=UNKNOWN' || true
                fi ;;
              *) printf '\n%s\n' 'SR_NATIVE_SOURCE_PHASE_V1 phase=UNKNOWN exit=UNKNOWN' || true ;;
            esac
            exit "$sr_native_phase_rc"
          }
          trap sr_native_phase_on_exit EXIT
          npm run typecheck:native-probe:root-source
          sr_native_phase=contracts_driver
          npm run test:native-probe
          sr_native_phase=root_tmpfs
          # Docker owns this empty bounded tmpfs; never use the overlay backing.
          test -d /var/lib/subscription-runtime-host-policy
          test ! -L /var/lib/subscription-runtime-host-policy
          [[ "$(stat -c '%u:%a' /var/lib/subscription-runtime-host-policy)" == '0:700' ]]
          [[ "$(findmnt --noheadings --mountpoint /var/lib/subscription-runtime-host-policy --output FSTYPE)" == tmpfs ]]
          [[ -z "$(find /var/lib/subscription-runtime-host-policy -mindepth 1 -maxdepth 1 -print -quit)" ]]
          install -d -m 0700 /var/lib/subscription-runtime-host-policy/dependency-test-jobs \
            /var/lib/subscription-runtime-host-policy/dependency-test-jobs/jobs
          # Real root-owned private I/O; finite systemd/proc DATA stays Source only.
          test "$(id -u):$(id -ru):$(id -g):$(id -rg)" = '0:0:0:0'
          test "$(uname -s)" = Linux
          /usr/bin/timeout --signal=TERM --kill-after=10s 600s \
            node node_modules/vitest/vitest.mjs run \
            --config vitest.operator-root-source.config.ts \
            --no-cache --configLoader runner --reporter=json \
            --outputFile=delivery/a0-native-probe/operator-root-source-result.json
          node node_modules/typescript/bin/tsc --ignoreConfig --noEmit --strict --types node \
            --noUncheckedIndexedAccess --exactOptionalPropertyTypes \
            --target ES2022 --module NodeNext --moduleResolution NodeNext \
            scripts/require-operator-root-source-result.mts
          node --experimental-strip-types scripts/require-operator-root-source-result.mts
          sr_native_phase=root_principal
          # Observe the actual principal before Vitest can project fixture facts.
          node --input-type=module-typescript - <<'ROOT_TEST_AUTHORITY'
          import assert from 'node:assert/strict';
          import { readFileSync, readlinkSync } from 'node:fs';
          assert.equal(process.platform, 'linux');
          assert.equal(process.getuid?.(), 0);
          assert.match(readFileSync('/proc/self/uid_map', 'utf8').trim(), /^0\s+0\s+4294967295$/);
          for (const ns of ['user', 'mnt', 'pid']) {
            assert.equal(readlinkSync(`/proc/self/ns/${ns}`), readlinkSync(`/proc/1/ns/${ns}`));
          }
          ROOT_TEST_AUTHORITY
          # Run the observation suite separately while the private TEST tmpfs is
          # empty. Keep the original four-file archive report contract unchanged.
          sr_native_phase=root_tests
          SR_ARCHIVE_TEST_PRIVILEGE=root \
            /usr/bin/timeout --signal=TERM --kill-after=10s 120s \
            node node_modules/vitest/vitest.mjs run \
            src/worker-codex/tests/codex-goal-project-dependency-inspection.test.ts \
            --maxWorkers=1 --no-cache --configLoader runner --reporter=json \
            --outputFile=delivery/a0-native-probe/dependency-inspection-root-result.json
          sr_native_phase=root_validator
          node --input-type=module-typescript - <<'DEPENDENCY_INSPECTION_ROOT_RESULT'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const report = JSON.parse(readFileSync('delivery/a0-native-probe/dependency-inspection-root-result.json', 'utf8'));
          const expected = new Set([
            'standalone project dependency observation observes supported Node metadata without a diagnostic, cache, claim or install',
            'standalone project dependency observation observes locked Python metadata and off-mode safety without writing',
            'standalone project dependency observation rejects a structural lease copy and a genuine closed lease',
            'standalone project dependency observation rejects an escaping manifest link rather than reading its bytes',
            'standalone project dependency observation delegates explicit V1 to the unchanged legacy route before reader-only lease checks',
            'standalone project dependency observation does not interpret an existing malformed binding as absence',
            'standalone project dependency observation rejects a symlinked protected binding namespace',
            'standalone project dependency observation rejects retained enrolled physical identity even after the original job path is gone',
            'standalone project dependency observation rejects a mounted workspace alias from the bounded mount observation',
            'standalone project dependency observation does not select a noncanonical or different child layout',
          ]);
          assert.equal(report.success, true);
          assert.equal(report.numTotalTests, expected.size);
          assert.equal(report.numPassedTests, expected.size);
          for (const counter of ['numFailedTests', 'numPendingTests', 'numTodoTests']) assert.equal(report[counter], 0);
          assert(Array.isArray(report.testResults) && report.testResults.length === 1);
          const file = report.testResults[0];
          assert.equal(file.name, resolve('src/worker-codex/tests/codex-goal-project-dependency-inspection.test.ts'));
          assert(Array.isArray(file.assertionResults) && file.assertionResults.length === expected.size);
          for (const test of file.assertionResults) {
            assert.equal(test.status, 'passed');
            assert(expected.delete(test.fullName));
          }
          assert.equal(expected.size, 0);
          console.log(JSON.stringify({ scope: 'native-root-dependency-inspection-TEST', completedTests: report.numTotalTests }));
          DEPENDENCY_INSPECTION_ROOT_RESULT
          # Nineteen real-filesystem component cases under the already verified ROOT principal.
          # Native permission/fence/path authority remains projected by these tests.

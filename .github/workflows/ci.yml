            "installer snapshot large-leaf DATA is exact measured Claude bytes only",
            "counterfeit accessors and proxies cannot execute during request capture",
            "command cells are descriptor snapshots rather than later caller reads",
            "public catalog paths never admit protected, escaped or executable input",
            "unknown or extra review fields remain refused DATA",
            "recognized request is copied DATA and changed limits cannot enter ROOT admission",
            "readonly mount DATA refuses stacked/writable/foreign physical observations",
            "FULL guest roots refuse global and foreign staging prefixes",
            "FULL input readonly mounts override job scratch write access",
            "H1 is a separate finite removal case with one fixed parent argv flag",
            "H1 libc requires exact reviewed root-owned two-link metadata",
            "H1 libc two-name DATA never widens to unknown hardlink routes",
            "unsupported H1 stdlib closure cannot reach private tool callbacks",
            "FULL review schema2 is exact fixed-r Positive/Ordinary and cannot downgrade",
            "Positive HOST libc DATA is finite and consumed exactly once",
            "Positive HOST libc DATA cannot select schema1 H1 or another role",
            "Positive HOST libc DATA never invokes input hooks",
            "schema2 finite account selection accepts exactly account-r or account-w",
            "schema2 protected outer review must match the exact selected account",
            "Positive HOST two fixed DSO roles consume the observed22 canonical rows",
            "FULL H1 separate subject digest is exact DATA-only selection",
            "Positive HOST second DSO rejects broadened roles and unconsumed proofs",
            "Positive HOST second DSO DATA never invokes hooks",
            "Positive HOST stable ancestry compares objects across namespace-local mounts",
            "source package contract keeps legacy and binds selected Positive package bytes",
            "staged constructor, census and close reject copied original-parent DATA before any physical work",
            "explicit preservation FULL configuration stays schema2 positive ordinary only",

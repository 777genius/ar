          grep -Fxq '# pass 8' "$GITHUB_WORKSPACE/dependency-h1-staged-data-ci-evidence/facts-root-tests.tap"
          grep -Fxq '# fail 0' "$GITHUB_WORKSPACE/dependency-h1-staged-data-ci-evidence/facts-root-tests.tap"
          grep -Fxq '# skipped 0' "$GITHUB_WORKSPACE/dependency-h1-staged-data-ci-evidence/facts-root-tests.tap"

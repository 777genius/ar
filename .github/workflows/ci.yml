name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Portable gates use disposable runners to avoid the shared ARC queue.
# RUNNER remains an explicit repository/environment override.
jobs:
  quality:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:boundaries

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ${{ vars.RUNNER || 'arc-runner-set' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - &unit_test_checkout
        uses: actions/checkout@v4
      - name: Fetch pinned legacy ledger fixture
        run: git fetch --no-tags --depth=1 origin d0a6885ddac5d90d765819359cfce05b756b7a54
      - &unit_test_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - name: Install encrypted checkpoint restore test dependency
        run: |
          if ! command -v restic >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends restic
          fi
          restic version
      - &unit_test_install
        run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - name: Run unit shard in a private TEST home
        shell: bash
        run: &private_test_home |
          set -euo pipefail
          # ARC's /home/runner is shared-writable. Allocate new TEST inventory
          # directly beneath /home; never chmod/adopt the existing runner HOME.
          for subscription_test_parent in / /home; do
            test -d "$subscription_test_parent" && test ! -L "$subscription_test_parent"
            test "$(readlink -f -- "$subscription_test_parent")" = "$subscription_test_parent"
            subscription_test_parent_mode=$(stat -c '%a' -- "$subscription_test_parent")
            (( (8#$subscription_test_parent_mode & 022) == 0 ))
          done
          subscription_test_home=$(sudo -n mktemp -d /home/subscription-ci-TEST-XXXXXX)
          subscription_test_home_identity=$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")
          cleanup_subscription_test_home() {
            local subscription_test_original_status=$?
            local subscription_test_cleanup_status=0
            if [[ "$subscription_test_home" =~ ^/home/subscription-ci-TEST-[[:alnum:]]{6}$ ]] &&
              [[ "$subscription_test_home_identity" == *:700 ]] &&
              test -d "$subscription_test_home" && test ! -L "$subscription_test_home" &&
              test "$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")" = "$subscription_test_home_identity"; then
              # Clear children without privilege. /home is root-owned, so only
              # unlinking the empty acquired HOME requires elevated rmdir.
              find "$subscription_test_home" -xdev -depth -mindepth 1 -delete || subscription_test_cleanup_status=$?
              if test -d "$subscription_test_home" && test ! -L "$subscription_test_home" &&
                test "$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")" = "$subscription_test_home_identity"; then
                sudo -n rmdir -- "$subscription_test_home" || subscription_test_cleanup_status=$?
              else
                echo "::error::Private TEST home identity changed after clearing children; cleanup refused"
                subscription_test_cleanup_status=1
              fi
            else
              echo "::error::Private TEST home identity changed; cleanup refused"
              subscription_test_cleanup_status=1
            fi
            if (( subscription_test_original_status != 0 )); then exit "$subscription_test_original_status"; fi
            exit "$subscription_test_cleanup_status"
          }
          trap cleanup_subscription_test_home EXIT
          sudo -n chown "$(id -u):$(id -g)" "$subscription_test_home"
          subscription_test_home_identity=$(stat -c '%d:%i:%u:%a' -- "$subscription_test_home")
          test "$(stat -c '%u:%g:%a' -- "$subscription_test_home")" = "$(id -u):$(id -g):700"
          export HOME="$subscription_test_home"
          case "$CI_TEST_TARGET" in
            1/4|2/4|3/4|4/4)
              # Every shard needs dist fixtures; retain the configured two
              # isolated forks and the full default test selection.
              npm run build
              npm run test:unit -- --shard="$CI_TEST_TARGET"
              ;;
            ancillary)
              npm run test:before-unit
              npx --no-install vitest run \
                src/provider-codex/tests/hosted-subscription-session-materializer.test.ts \
                src/provider-codex/tests/app-server/codex-subscription-prepared-profile.test.ts \
                src/worker-codex/tests/codex-subscription-consumer-preparation.test.ts
              npm run test:after-unit
              ;;
            *)
              echo "::error::Unknown CI test target"
              exit 1
              ;;
          esac
        env:
          CI_TEST_TARGET: ${{ matrix.shard }}/4
          SR_ARCHIVE_TEST_PRIVILEGE: nonroot

  unit-test-ancillary:
    runs-on: ${{ vars.RUNNER || 'arc-runner-set' }}
    steps:
      - *unit_test_checkout
      - *unit_test_node
      - *unit_test_install
      - name: Run non-Vitest test phases once in a private TEST home
        shell: bash
        run: *private_test_home
        env:
          CI_TEST_TARGET: ancillary
          SR_ARCHIVE_TEST_PRIVILEGE: nonroot

  unit-tests:
    if: ${{ always() }}
    needs: [unit-test-shards, unit-test-ancillary]
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'arc-ci-control' }}
    steps:
      - name: Require all four unit shards and ancillary phases
        env:
          UNIT_TEST_SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
          UNIT_TEST_ANCILLARY_RESULT: ${{ needs.unit-test-ancillary.result }}
        run: |
          set -euo pipefail
          test "$UNIT_TEST_SHARDS_RESULT" = success
          test "$UNIT_TEST_ANCILLARY_RESULT" = success
          echo "All four unit shards executed successfully; ancillary phases passed."

  archive-root-tests:
    # Only the fixed disposable TEST command is elevated, on an ephemeral host.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run build:packages
      - name: Qualify archive and custody regressions on disposable TEST identities
        shell: bash
        run: |
          set -euo pipefail
          archive_test_root=$(mktemp -d /tmp/sr-archive-ci-TEST-XXXXXX)
          trap 'sudo -n /bin/rm -rf --one-file-system -- "$archive_test_root"' EXIT
          # No checkout Git metadata, HOME, credentials or real job data enters
          # the TEST copy. Fixtures create their own root-owned 0600 permits.
          cp -a src packages node_modules package.json vitest.config.ts tsconfig.json "$archive_test_root/"
          mkdir "$archive_test_root/home" "$archive_test_root/temp"
          archive_test_node=$(command -v node)
          cd "$archive_test_root"
          sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME="$archive_test_root/home" \
            TMPDIR="$archive_test_root/temp" XDG_CONFIG_HOME="$archive_test_root/home" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            SR_ARCHIVE_TEST_PRIVILEGE=root \
            "$archive_test_node" node_modules/vitest/vitest.mjs run \
            src/worker-codex/tests/codex-goal-mcp-project-reviewed-archive.test.ts \
            src/worker-codex/tests/hosted-readonly-custody-record-once.test.ts \
            --maxWorkers=1 --no-cache --configLoader runner

  observer-mount-tests:
    # Fresh disposable VM: namespace capabilities on the shared ARC runner are
    # not assumed. Only the fixed TEST helper receives sudo here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch locked TEST dependencies
        run: for i in 1 2 3; do npm ci --ignore-scripts && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run build:packages
      - name: Typecheck scratch preparation and the native TEST helper
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
          node node_modules/typescript/bin/tsc -p scripts/test-scratch-mount-propagation.tsconfig.json
      - name: Require scratch preparation and adjacent research contracts
        run: |
          npm run build
          node node_modules/vitest/vitest.mjs run --maxWorkers=1 \
            src/worker-codex/tests/host-scratch-temp.test.ts \
            src/worker-codex/tests/host-scratch-mount.test.ts \
            src/worker-codex/tests/host-scratch-mount-observation-cost.test.ts \
            src/worker-codex/tests/research-provider-service.test.ts \
            src/worker-codex/tests/research-provider-root.test.ts \
            src/worker-codex/tests/research-launch-diagnostics.test.ts \
            src/worker-codex/tests/research-launch-diagnostics-privacy.test.ts
      - name: Require real shared-source leaf isolation in a fresh TEST namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir scratch-mount-evidence
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin \
            /usr/bin/timeout --signal=TERM --kill-after=5s 30s \
            /usr/bin/unshare --mount --propagation private \
            "$(command -v node)" --experimental-strip-types scripts/test-scratch-mount-propagation.mts \
            | tee scratch-mount-evidence/result.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: scratch-mount-propagation-evidence
          path: scratch-mount-evidence/result.json
          if-no-files-found: error
          retention-days: 7
      - name: Typecheck the focused namespace helper
        run: node node_modules/typescript/bin/tsc -p scripts/test-dependency-observer-mount-namespace.tsconfig.json
      - name: Require actual observer mount negatives and FD-close oracle
        env:
          TEST_SOURCE_SHA: ${{ github.sha }}
        run: |
          sudo -n --preserve-env=CI,GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_TEMP,TEST_SOURCE_SHA \
            "$(command -v node)" --experimental-strip-types scripts/test-dependency-observer-mount-namespace.ts
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: observer-mount-evidence
          path: observer-mount-evidence/result.json
          if-no-files-found: error
          retention-days: 7

  package:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run check:packed-consumer -- --retain-validated-tarball
      - name: Upload the same validated public runtime package
        uses: actions/upload-artifact@v4
        with:
          name: native-test-runtime-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: vioxen-subscription-runtime-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Strict emit Python envelope filesystem TEST in existing package job
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p dependency-python-envelope-package-root-evidence
          printf '{"schemaVersion":1,"sourceSha":"%s","purpose":"package-job-four-root-filesystem-TEST-not-native-qualification"}\n' "$TEST_SOURCE_SHA" > dependency-python-envelope-package-root-evidence/source.json
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE_SHA"
          node --version > dependency-python-envelope-package-root-evidence/node-version.txt
          node node_modules/typescript/bin/tsc --version > dependency-python-envelope-package-root-evidence/typescript-version.txt
          grep -Fxq 'Version 6.0.3' dependency-python-envelope-package-root-evidence/typescript-version.txt
          sha256sum \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.ts \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.ts \
            scripts/dependency-retention-os-test/current-full-python-envelope-catalog.ts \
            scripts/dependency-retention-os-test/tsconfig.python-envelope-emit.json \
            scripts/dependency-retention-os-test/assemble-current-full.ts \
            .github/workflows/dependency-retention-os-registration-test.yml \
            .github/workflows/ci.yml \
            > dependency-python-envelope-package-root-evidence/source.sha256
          node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.python-envelope-emit.json 2>&1 | tee dependency-python-envelope-package-root-evidence/strict-emit.log
          sha256sum \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.js \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.js \
            scripts/dependency-retention-os-test/current-full-python-envelope-catalog.js \
            > dependency-python-envelope-package-root-evidence/emitted.sha256
      - name: Require four actual root Linux filesystem envelope scenarios on existing ARC runner
        run: |
          set -o pipefail
          TEST_NODE="$(readlink -f "$(command -v node)")"
          if [ "$(id -u)" -eq 0 ]; then
            env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" TEST_PYTHON_ENVELOPE_ROOT_CI=1 \
              "$TEST_NODE" --test --test-reporter=tap \
              "$GITHUB_WORKSPACE/host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.js"
          else
            sudo -n env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TMPDIR="$RUNNER_TEMP" TEST_PYTHON_ENVELOPE_ROOT_CI=1 \
              "$TEST_NODE" --test --test-reporter=tap \
              "$GITHUB_WORKSPACE/host-integration/managed-launcher/dependency-full-python-envelope-TEST.node-test.js"
          fi 2>&1 | tee dependency-python-envelope-package-root-evidence/root-tests.tap
          TAP=dependency-python-envelope-package-root-evidence/root-tests.tap
          grep -Eq '^ok [0-9]+ - complete native census reconciles all candidates and refuses late unknown source/bytecode$' "$TAP"
          grep -Eq '^ok [0-9]+ - native complete EOF is mandatory at exact entry/byte limits and aliases cannot escape$' "$TAP"
          grep -Eq '^ok [0-9]+ - native candidate metadata refuses hardlinks and writable source even with matching content$' "$TAP"
          grep -Eq '^ok [0-9]+ - alias literal size participates in file bound and largest-file measurement$' "$TAP"
          grep -Eq '^ok [0-9]+ - ROOT fixed DATA census pins exact signed site target and excludes arbitrary etc content$' "$TAP"
          grep -Eq '^ok [0-9]+ - ROOT fixed DATA census refuses ancestor aliases unknown raw literals and wrong signed provider$' "$TAP"
          grep -Eq '^ok [0-9]+ - native census refuses caller-owned fixture before reading candidate content # SKIP root-owned positive census requires separate Linux integration$' "$TAP"
          grep -Fxq '# tests 21' "$TAP"
          grep -Fxq '# pass 20' "$TAP"
          grep -Fxq '# fail 0' "$TAP"
          grep -Fxq '# skipped 1' "$TAP"
          test "$(grep -c ' # SKIP ' "$TAP")" -eq 1
      - name: Retain package-job exact-source root filesystem TEST evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-python-envelope-package-root-${{ github.event.pull_request.head.sha || github.sha }}
          path: dependency-python-envelope-package-root-evidence/
          if-no-files-found: error

      - name: Strict emit fixed H1 signed DATA acquisition TEST and bind exact source
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p dependency-h1-tool-inputs-ci-source-evidence
          printf '{"schemaVersion":1,"sourceSha":"%s","purpose":"disposable-signed-CI-data-not-native-qualification"}\n' "$TEST_SOURCE_SHA" > dependency-h1-tool-inputs-ci-source-evidence/source.json
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE_SHA"
          node --version > dependency-h1-tool-inputs-ci-source-evidence/node-version.txt
          node node_modules/typescript/bin/tsc --version > dependency-h1-tool-inputs-ci-source-evidence/typescript-version.txt
          grep -Fxq 'Version 6.0.3' dependency-h1-tool-inputs-ci-source-evidence/typescript-version.txt
          sha256sum \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci.ts \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci-index.ts \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci-index.node-test.ts \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-package.ts \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-package.node-test.ts \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci-publication.node-test.ts \
            scripts/dependency-retention-os-test/current-h1-archive-format-census.ts \
            scripts/dependency-retention-os-test/current-h1-archive-format-census.node-test.ts \
            scripts/dependency-retention-os-test/current-h1-archive-members-TEST.ts \
            scripts/dependency-retention-os-test/current-h1-archive-members.node-test.ts \
            scripts/dependency-retention-os-test/current-h1-archive-path-graph-TEST.ts \
            scripts/dependency-retention-os-test/current-h1-archive-path-graph.node-test.ts \
            scripts/dependency-retention-os-test/current-h1-selected-toolroot-TEST.ts \
            scripts/dependency-retention-os-test/current-h1-selected-toolroot-filesystem-TEST.ts \
            scripts/dependency-retention-os-test/current-h1-selected-toolroot.node-test.ts \
            scripts/dependency-retention-os-test/tsconfig.h1-tool-inputs-ci-emit.json \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.ts \
            .github/workflows/ci.yml \
            package-lock.json \
            node_modules/typescript/package.json \
            node_modules/typescript/bin/tsc \
            node_modules/typescript/lib/_tsc.js \
            > dependency-h1-tool-inputs-ci-source-evidence/source-and-compiler.sha256
          node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.h1-tool-inputs-ci-emit.json 2>&1 | tee dependency-h1-tool-inputs-ci-source-evidence/strict-emit.log
          sha256sum \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci.js \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci-index.js \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci-index.node-test.js \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-package.js \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-package.node-test.js \
            scripts/dependency-retention-os-test/current-h1-tool-inputs-ci-publication.node-test.js \
            scripts/dependency-retention-os-test/current-h1-archive-format-census.js \
            scripts/dependency-retention-os-test/current-h1-archive-format-census.node-test.js \
            scripts/dependency-retention-os-test/current-h1-archive-members-TEST.js \
            scripts/dependency-retention-os-test/current-h1-archive-members.node-test.js \
            scripts/dependency-retention-os-test/current-h1-archive-path-graph-TEST.js \
            scripts/dependency-retention-os-test/current-h1-archive-path-graph.node-test.js \
            scripts/dependency-retention-os-test/current-h1-selected-toolroot-TEST.js \
            scripts/dependency-retention-os-test/current-h1-selected-toolroot-filesystem-TEST.js \
            scripts/dependency-retention-os-test/current-h1-selected-toolroot.node-test.js \
            host-integration/managed-launcher/dependency-full-python-envelope-TEST.js \
            > dependency-h1-tool-inputs-ci-source-evidence/emitted.sha256
      - name: Collect independently signed exact tool DATA on disposable root ARC job
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          TEST_NODE="$(readlink -f "$(command -v node)")"
          if [ "$(id -u)" -eq 0 ]; then
            env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C CI=true GITHUB_ACTIONS=true \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" TEST_SOURCE_SHA="$TEST_SOURCE_SHA" \
              "$TEST_NODE" "$GITHUB_WORKSPACE/scripts/dependency-retention-os-test/current-h1-tool-inputs-ci.js"
          else
            sudo -n env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C CI=true GITHUB_ACTIONS=true \
              GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" TEST_SOURCE_SHA="$TEST_SOURCE_SHA" \
              "$TEST_NODE" "$GITHUB_WORKSPACE/scripts/dependency-retention-os-test/current-h1-tool-inputs-ci.js"
          fi 2>&1 | tee dependency-h1-tool-inputs-ci-source-evidence/entry.log
          TAP=dependency-h1-tool-inputs-ci-evidence/root-tests.tap
          grep -Eq '^ok [0-9]+ - real acquired file hashes retained bytes and refuses post-read deadline/identity mutation$' "$TAP"
          grep -Eq '^ok [0-9]+ - retained original archive rejects equal-byte replacement between verification and extraction$' "$TAP"
          grep -Eq '^ok [0-9]+ - over-cap same DATA capture retains complete canonical body while original candidate stays absent/HOLD$' "$TAP"
          grep -Eq '^ok [0-9]+ - stale size/hash/count commitments refuse before any publication$' "$TAP"
          grep -Eq '^ok [0-9]+ - fixed operational boundary is inclusive but plus one refuses before serialization/write$' "$TAP"
          grep -Eq '^ok [0-9]+ - raw tar survey preserves literal bytes, privileged mode and repeated hardlink observations without path authority$' "$TAP"
          grep -Eq '^ok [0-9]+ - GNU and PAX raw extensions preserve original bytes while effective member census stays unresolved$' "$TAP"
          grep -Eq '^ok [0-9]+ - unsupported size or checksum and incomplete raw EOF hold without guessing another header$' "$TAP"
          grep -Fxq '# tests 41' "$TAP"
          grep -Fxq '# pass 40' "$TAP"
          grep -Eq '^ok [0-9]+ - GNU basic rows retain original privileged mode and absolute dotdot literals without namespace authority$' "$TAP"
          grep -Eq '^ok [0-9]+ - GNU basic profile drift and interpayload padding refuse before any row publication$' "$TAP"
          grep -Eq '^ok [0-9]+ - GNU original stream package commitments and one absolute deadline veto stale results$' "$TAP"
          grep -Eq '^ok [0-9]+ - GNU complete DATA serialization has inclusive operational cap and exact owned readback$' "$TAP"
          grep -Fxq '# fail 0' "$TAP"
          grep -Fxq '# skipped 1' "$TAP"
          grep -Eq '^ok [0-9]+ - ordinary caller-owned file cannot become original root-owned archive authority # SKIP nonroot negative is exercised by separate caller-owned environment$' "$TAP"
          grep -Eq '^ok [0-9]+ - fixed H1 graph retains repeated directory origins and mtimes with deterministic DATA identity$' "$TAP"
          grep -Eq '^ok [0-9]+ - fixed H1 canonical collisions unsafe parents and directory security drift refuse before writes$' "$TAP"
          grep -Eq '^ok [0-9]+ - fixed H1 alias graph keeps missing unselected targets and pending site recipe but vetoes unsafe edges$' "$TAP"
          grep -Eq '^ok [0-9]+ - fixed H1 role selects original nsenter but excludes privileged and absent objects and refuses origin drift$' "$TAP"
          grep -Eq '^ok [0-9]+ - fixed H1 complete records enforce operational boundary deadline and owned exclusive publication$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected main refuses incomplete fixed image before filesystem writes$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected filesystem refuses unsafe namespace budget and expired deadline before any anchor$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected filesystem refuses hidden JSON hooks getters and proxies without invoking them$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected entry rejects inherited hooks without invocation$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT requires exact recursively frozen original member row bindings before anchor$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT preserves every object yield and live joins with one detached plan canonicalization$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT detects nested caller mutations at real yields including frozen parents and complete fallback$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT refuses inherited function and getter hooks at optimized fallback and publication windows$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT mechanics writes exact content mode time rewrite and distinct recipe provenance$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT mechanics rejects equal-byte archive replacement and existing root without reuse$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT mechanics vetoes original slice mutation after yield with held partial output$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT mechanics observes real signal cancellation at built-in yield and closes owned handles$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT mechanics detects output substitution extra entries and unsafe alias plans$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT mechanics refuses substituted retained parent and preserves outside TEST sentinel$' "$TAP"
          grep -Eq '^ok [0-9]+ - selected ROOT mechanics holds on real write fsync readback and post-I/O deadline faults$' "$TAP"
          test "$(grep -c ' # SKIP ' "$TAP")" -eq 1
      - name: Retain curated signed DATA and exact workflow evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-h1-tool-inputs-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dependency-h1-tool-inputs-ci-source-evidence/
            dependency-h1-tool-inputs-ci-evidence/
          if-no-files-found: error

      - name: Strict emit fixed staged H1 DATA tests and bind exact source closure
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p dependency-h1-staged-data-ci-evidence
          printf '{"schemaVersion":1,"sourceSha":"%s","purpose":"root-filesystem-staged-H1-DATA-not-constructor-qualification"}\n' "$TEST_SOURCE_SHA" > dependency-h1-staged-data-ci-evidence/source.json
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE_SHA"
          node --version > dependency-h1-staged-data-ci-evidence/node-version.txt
          node node_modules/typescript/bin/tsc --version > dependency-h1-staged-data-ci-evidence/typescript-version.txt
          grep -Fxq 'Version 6.0.3' dependency-h1-staged-data-ci-evidence/typescript-version.txt
          sha256sum \
            host-integration/managed-launcher/dependency-full-h1-staged-tools-TEST.ts \
            host-integration/managed-launcher/dependency-full-h1-staged-tools-TEST.node-test.ts \
            host-integration/managed-launcher/dependency-full-native-TEST.ts \
            host-integration/managed-launcher/dependency-full-native-TEST.node-test.ts \
            host-integration/managed-launcher/launch.mjs \
            host-integration/managed-launcher/payload-guard.mjs \
            host-integration/managed-launcher/profiles.mjs \
            host-integration/host-jobs/storage-policy.mjs \
            scripts/dependency-retention-os-test/tsconfig.h1-staged-data-ci-emit.json \
            .github/workflows/ci.yml package.json package-lock.json \
            node_modules/typescript/package.json node_modules/typescript/bin/tsc node_modules/typescript/lib/_tsc.js \
            > dependency-h1-staged-data-ci-evidence/source-and-compiler.sha256
          node node_modules/typescript/bin/tsc -p scripts/dependency-retention-os-test/tsconfig.h1-staged-data-ci-emit.json 2>&1 | tee dependency-h1-staged-data-ci-evidence/strict-emit.log
          sha256sum \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher/dependency-full-h1-staged-tools-TEST.js \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher/dependency-full-h1-staged-tools-TEST.node-test.js \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher/dependency-full-native-TEST.js \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher/dependency-full-native-TEST.node-test.js \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher/launch.mjs \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher/payload-guard.mjs \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher/profiles.mjs \
            outputs/TEST-h1-staged-data-ci-emit/host-integration/host-jobs/storage-policy.mjs \
            > dependency-h1-staged-data-ci-evidence/emitted.sha256
      - name: Require three actual Linux ROOT staged DATA physical tests with unchanged H1 refusal
        run: |
          set -o pipefail
          TEST_NODE="$(readlink -f "$(command -v node)")"
          TEST_EMIT="$GITHUB_WORKSPACE/outputs/TEST-h1-staged-data-ci-emit/host-integration/managed-launcher"
          if [ "$(id -u)" -eq 0 ] && [ "$(id -ru)" -eq 0 ] && [ "$(id -g)" -eq 0 ] && [ "$(id -rg)" -eq 0 ]; then
            env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
              /bin/sh -c 'test "$(id -u)" -eq 0 && test "$(id -ru)" -eq 0 && test "$(id -g)" -eq 0 && test "$(id -rg)" -eq 0 && test "$(uname -s)" = Linux || exit 1; id; exec "$@"' TEST-H1-staged-root \
              "$TEST_NODE" --test --test-reporter=tap "$TEST_EMIT/dependency-full-h1-staged-tools-TEST.node-test.js" "$TEST_EMIT/dependency-full-native-TEST.node-test.js"
          else
            sudo -n -u root -g root env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
              /bin/sh -c 'test "$(id -u)" -eq 0 && test "$(id -ru)" -eq 0 && test "$(id -g)" -eq 0 && test "$(id -rg)" -eq 0 && test "$(uname -s)" = Linux || exit 1; id; exec "$@"' TEST-H1-staged-root \
              "$TEST_NODE" --test --test-reporter=tap "$TEST_EMIT/dependency-full-h1-staged-tools-TEST.node-test.js" "$TEST_EMIT/dependency-full-native-TEST.node-test.js"
          fi 2>&1 | tee dependency-h1-staged-data-ci-evidence/root-tests.tap
          TAP=dependency-h1-staged-data-ci-evidence/root-tests.tap
          grep -Eq '^ok [0-9]+ - actual retained physical inode replacement, extra entry, nlink and deadline refuse$' "$TAP"
          grep -Eq '^ok [0-9]+ - actual owned read expires at post-I/O monotonic check and closes permanently$' "$TAP"
          grep -Eq '^ok [0-9]+ - actual invalid literal alias bytes refuse including equal encoded-size case$' "$TAP"
          grep -Eq '^ok [0-9]+ - unsupported H1 stdlib closure cannot reach private tool callbacks$' "$TAP"
          grep -Fxq '# tests 24' "$TAP"
          grep -Fxq '# pass 24' "$TAP"
          grep -Fxq '# fail 0' "$TAP"
          grep -Fxq '# skipped 0' "$TAP"
          if grep -q ' # SKIP ' "$TAP"; then exit 1; fi
      - name: Retain staged H1 DATA exact-source physical TEST evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-h1-staged-data-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: dependency-h1-staged-data-ci-evidence/
          if-no-files-found: error

  native-probe-source:
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Keep JavaScript actions on the host runner. The TEST container receives
      # only a Git archive via Docker's API, never runner/auth/socket mounts.
      - name: Run disposable NativeProbe SOURCE container
        id: native
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          owned=$(mktemp -d "$RUNNER_TEMP/native-probe-source-TEST-XXXXXX")
          printf 'evidence=%s\n' "$owned" >> "$GITHUB_OUTPUT"
          name="native-probe-source-TEST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$name" > "$owned/container-name.txt"
          git rev-parse HEAD > "$owned/source-commit.txt"
          git rev-parse HEAD^{tree} > "$owned/source-tree.txt"
          git archive --format=tar HEAD > "$owned/source.tar"
          sha256sum "$owned/source.tar" > "$owned/source-archive.sha256"
          cat > "$owned/command.sh" <<'TEST_COMMAND'
          set -euo pipefail
          umask 077
          mkdir -p /native-probe-source-workspace/{source,tmp,home,cache}
          tar -xf /source.tar -C /native-probe-source-workspace/source
          cd /native-probe-source-workspace/source
          mkdir -p delivery/a0-native-probe
          npm ci
          npm run typecheck:native-probe
          npm run typecheck:native-probe:root-source
          npm run test:native-probe
          TEST_COMMAND
          timeout --signal=TERM --kill-after=10s 90s docker create --name "$name" --label "native-probe-source.owner=$owner" \
            --user 0:0 --init node:24-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0 \
            /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin \
            HOME=/native-probe-source-workspace/home \
            TMPDIR=/native-probe-source-workspace/tmp \
            npm_config_cache=/native-probe-source-workspace/cache \
            SR_NATIVE_PROBE_TMP=/native-probe-source-workspace/tmp \
            /usr/bin/timeout --signal=TERM --kill-after=10s 15m \
            /bin/bash /command.sh > "$owned/container-id.txt" 2> "$owned/create.stderr"
          id=$(cat "$owned/container-id.txt")
          [[ "$id" =~ ^[a-f0-9]{64}$ ]]
          printf 'container=%s\n' "$id" >> "$GITHUB_OUTPUT"
          timeout 30s docker cp "$owned/source.tar" "$id:/source.tar" \
            > "$owned/input-copy.stdout" 2> "$owned/input-copy.stderr"
          timeout 30s docker cp "$owned/command.sh" "$id:/command.sh" \
            >> "$owned/input-copy.stdout" 2>> "$owned/input-copy.stderr"
          set +e
          timeout --signal=TERM --kill-after=10s 16m docker start --attach "$id" \
            > "$owned/container.stdout" 2> "$owned/container.stderr"
          attach_rc=$?
          set -e
          printf '%s\n' "$attach_rc" > "$owned/attach-exit.txt"
          docker inspect "$id" > "$owned/container-inspect.json"
          identity=$(docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "native-probe-source.owner"}}' "$id")
          [[ "$identity" == "$id|/$name|$owner" ]]
          state=$(docker inspect --format '{{.State.Status}}' "$id")
          if [[ "$state" != exited ]]; then
            printf '::error::Owned container %s is %s; retained without cleanup. Evidence: %s\n' "$id" "$state" "$owned"
            exit 1
          fi
          container_rc=$(docker inspect --format '{{.State.ExitCode}}' "$id")
          printf '%s\n' "$container_rc" > "$owned/container-exit.txt"
          # Stream tar archives without following container symlinks or exposing
          # root-owned fixtures to runner-side extraction/upload traversal.
          timeout 30s docker cp "$id:/native-probe-source-workspace/source/delivery/a0-native-probe" - \
            > "$owned/source-evidence.tar" 2> "$owned/evidence-copy.stderr"
          timeout 30s docker cp "$id:/native-probe-source-workspace/tmp" - \
            > "$owned/remaining-test-tmp.tar" 2> "$owned/tmp-copy.stderr"
          printf 'exported=true\n' >> "$GITHUB_OUTPUT"
          # A test failure stays a failure even though its diagnostics exported.
          if [[ "$container_rc" != 0 ]]; then exit "$container_rc"; fi
          exit "$attach_rc"
      - name: Export NativeProbe SOURCE evidence
        id: native_artifact
        if: ${{ always() && steps.native.outputs.evidence != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-probe-source-checks
          path: ${{ steps.native.outputs.evidence }}
          if-no-files-found: error
      - name: Remove only exported stopped TEST container
        if: ${{ always() && steps.native.outputs.container != '' }}
        shell: bash
        env:
          OWNED_CONTAINER: ${{ steps.native.outputs.container }}
          EVIDENCE_EXPORTED: ${{ steps.native.outputs.exported }}
          ARTIFACT_RESULT: ${{ steps.native_artifact.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EVIDENCE_EXPORTED" != true || "$ARTIFACT_RESULT" != success ]]; then
            printf '::warning::Retaining owned container %s: evidence export incomplete.\n' "$OWNED_CONTAINER"
            exit 1
          fi
          [[ "$OWNED_CONTAINER" =~ ^[a-f0-9]{64}$ ]]
          expected="/native-probe-source-TEST-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          actual=$(docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "native-probe-source.owner"}}|{{.State.Status}}|{{.State.Running}}' "$OWNED_CONTAINER")
          if [[ "$actual" != "$OWNED_CONTAINER|$expected|$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT|exited|false" ]]; then
            printf '::error::Owned container %s custody/stop check failed; retained.\n' "$OWNED_CONTAINER"
            exit 1
          fi
          docker rm "$OWNED_CONTAINER"
          # Runner-owned files remain available through job end and in artifact.

  crash-boundary-shards:
    permissions:
      contents: read
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        lane: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Bounded retry: `npm ci` is a pure download step and runner
      # registry egress can be intermittently flaky. Gates are never
      # retried — only this fetch.
      - run: for i in 1 2 3; do npm ci && break; [ $i -eq 3 ] && exit 1; sleep 10; done
      - run: npm run build:packages
      - name: Certify crash-boundary shards in lane ${{ matrix.lane }}
        env:
          CODEX_LEDGER_EPOCH_CRASH_RANGE_ONLY: "1"
          SHARD_LANE: ${{ matrix.lane }}
        run: |
          shard="$SHARD_LANE"
          while [ "$shard" -le 53 ]; do
            file="src/worker-codex/tests/codex-goal-ledger-epoch-handler-crash-shard-${shard}.test.ts"
            timeout --signal=TERM --kill-after=10s 240s \
              npm run test:crash-shard -- "$file"
            shard=$((shard + 8))
          done

  crash-boundary-shards-complete:
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [crash-boundary-shards]
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Verify every crash-boundary shard lane passed
        env:
          CRASH_BOUNDARY_SHARDS_RESULT: ${{ needs.crash-boundary-shards.result }}
        run: test "$CRASH_BOUNDARY_SHARDS_RESULT" = "success"

  test:
    if: ${{ always() }}
    needs: [quality, unit-tests, observer-mount-tests, archive-root-tests, package, native-probe-source, crash-boundary-shards-complete]
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Verify all CI gates passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          OBSERVER_MOUNT_RESULT: ${{ needs.observer-mount-tests.result }}
          ARCHIVE_ROOT_TESTS_RESULT: ${{ needs.archive-root-tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          NATIVE_PROBE_SOURCE_RESULT: ${{ needs.native-probe-source.result }}
          CRASH_BOUNDARY_SHARDS_RESULT: ${{ needs.crash-boundary-shards-complete.result }}
        run: |
          if [ "$QUALITY_RESULT" = "success" ] && \
             [ "$UNIT_TESTS_RESULT" = "success" ] && \
             [ "$OBSERVER_MOUNT_RESULT" = "success" ] && \
             [ "$ARCHIVE_ROOT_TESTS_RESULT" = "success" ] && \
             [ "$PACKAGE_RESULT" = "success" ] && \
             [ "$NATIVE_PROBE_SOURCE_RESULT" = "success" ] && \
             [ "$CRASH_BOUNDARY_SHARDS_RESULT" = "success" ]; then
            exit 0
          fi

          echo "quality: $QUALITY_RESULT"
          echo "unit-tests: $UNIT_TESTS_RESULT"
          echo "observer-mount-tests: $OBSERVER_MOUNT_RESULT"
          echo "archive-root-tests: $ARCHIVE_ROOT_TESTS_RESULT"
          echo "package: $PACKAGE_RESULT"
          echo "native-probe-source: $NATIVE_PROBE_SOURCE_RESULT"
          echo "crash-boundary-shards-complete: $CRASH_BOUNDARY_SHARDS_RESULT"
          exit 1

          printf 'TEST permission sentinel\n' > "$H1_STAGE/foreign/sentinel"
          chown 65534:65534 "$H1_STAGE/foreign"
          unshare --user --map-root-user /usr/bin/test -x "$H1_STAGE" 9<&-

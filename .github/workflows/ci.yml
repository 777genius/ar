          const expected = new Set(["signed-publisher DATA remains distinct from reproduced compilation and never issues native authority", "missing HOST/staged package references, source definitions and substituted archive assets refuse", "fixed verifier roles cannot introduce a caller executable or escaping alias", "DATA parsers reject accessor/proxy/array hooks without invoking them", "asset names are derived only from exact hashes; filenames cannot escape original review root", "an unqualified DATA subject cannot even start a native verifier", "separate original HOST nspawn/loader/every DSO coverage cannot be supplied by staged binaries", "genuine ROOT Linux source census directory/file/alias rows retain their original discriminated grammar"]);

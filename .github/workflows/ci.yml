          test "$(stat -c '%u:%g:%a:%F' /tmp)" = 0:0:1777:directory
          umask 077
          H1_STAGE=$(mktemp -d /tmp/TEST-H1-root-data.XXXXXXXX)
          H1_STAGE_ID=$(stat -c '%d:%i:%u:%g:%a:%F' "$H1_STAGE")
          exec 9<"$H1_STAGE"
          h1_rejoin_stage() {
            test "$(stat -c '%u:%g:%a:%F' /)" = 0:0:755:directory &&
            test "$(stat -c '%u:%g:%a:%F' /tmp)" = 0:0:1777:directory &&
            test "$(stat -c '%u:%g:%a:%F' "$H1_STAGE")" = 0:0:700:directory &&
            test "$(stat -c '%d:%i:%u:%g:%a:%F' "$H1_STAGE")" = "$H1_STAGE_ID" &&
            test "$(stat -Lc '%d:%i:%u:%g:%a:%F' "/proc/self/fd/9")" = "$H1_STAGE_ID"
          }
          h1_cleanup_stage() {
            H1_PRIMARY=$?
            trap - EXIT
            if h1_rejoin_stage && rm -rf --one-file-system -- "$H1_STAGE"; then :; else
              echo 'TEST GHA signed DATA staging cleanup unproven' >&2
              if [ "$H1_PRIMARY" -eq 0 ]; then H1_PRIMARY=70; fi
            fi

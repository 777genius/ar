name: Publish Registry Contract

on:
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-registry-contract.yml"
      - "scripts/check-publish-registry-contract.mjs"
      - "scripts/publish-preflight.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-registry-contract.yml"
      - "scripts/check-publish-registry-contract.mjs"
      - "scripts/publish-preflight.mjs"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry-auth:
    runs-on: ${{ vars.RUNNER || 'arc-runner-set' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js Linux runtime prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The official Linux Node.js binary needs libatomic.so.1 before setup-node can run it.
          have_libatomic() { grep -q 'libatomic\.so\.1 ' < <(/sbin/ldconfig -p 2>/dev/null); }
          if have_libatomic; then exit 0; fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::libatomic.so.1 is missing and this Linux runner has no apt-get"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1
          have_libatomic
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - run: npm run check:publish-registry-contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

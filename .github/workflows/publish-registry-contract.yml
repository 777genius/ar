name: Publish Registry Contract

on:
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-registry-contract.yml"
      - "scripts/check-publish-registry-contract.mjs"
      - "scripts/publish-preflight.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-registry-contract.yml"
      - "scripts/check-publish-registry-contract.mjs"
      - "scripts/publish-preflight.mjs"

permissions:
  contents: read
  packages: read

jobs:
  registry-auth:
    if: ${{ github.repository == 'vioxen/subscription-runtime' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run check:publish-registry-contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

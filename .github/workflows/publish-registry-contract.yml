name: Publish Registry Contract

on:
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-registry-contract.yml"
      - "scripts/check-publish-registry-contract.mjs"
      - "scripts/publish-preflight.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-registry-contract.yml"
      - "scripts/check-publish-registry-contract.mjs"
      - "scripts/publish-preflight.mjs"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry-auth:
    runs-on: ${{ vars.RUNNER || 'arc-runner-set' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:publish-registry-contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

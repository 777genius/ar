name: Dependency retention Linux TEST primitives

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**/dependency-environment/**'
      - 'src/**/hosted-dependency-*.ts'
      - 'src/worker-codex/hosted-installation-activation.ts'
      - 'scripts/dependency-retention-test/**'
      - '.github/workflows/dependency-retention-linux-test.yml'
      - 'scripts/dependency-retention-os-test/**'
      - '.github/workflows/dependency-retention-os-test.yml'
      - 'src/worker-codex/hosted-readonly-*.ts'
      - 'src/worker-codex/hosted-test-egress-*.ts'
      - 'src/worker-codex/trusted-custody-systemd-launch.ts'
      - 'src/worker-codex/codex-goal-*.ts'
      - 'src/provider-codex/app-server/adapters/hosted-*.ts'
      - 'src/provider-codex/app-server/adapters/system-bus-infrastructure.ts'
      - 'src/core/host-infrastructure/**'

permissions:
  contents: read

jobs:
  native-test-primitives:
    # A fresh GitHub-hosted VM is required: never inherit a configured host pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Typecheck handwritten qualification harness
        run: node node_modules/typescript/bin/tsc -p scripts/dependency-retention-test/tsconfig.json
      - name: Prepare fresh root-owned TEST artifact and toolchain
        run: |
          test ! -e /usr/local/lib/subscription-runtime-dependency-TEST
          test ! -e /var/lib/subscription-runtime-host-policy
          sudo mkdir -m 0755 /usr/local/lib/subscription-runtime-dependency-TEST
          sudo cp -a dist package.json scripts node_modules packages /usr/local/lib/subscription-runtime-dependency-TEST/
          sudo mkdir -m 0755 /usr/local/lib/subscription-runtime-dependency-TEST/toolchain
          sudo cp -a "$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")/." /usr/local/lib/subscription-runtime-dependency-TEST/toolchain/
          sudo chown -R root:root /usr/local/lib/subscription-runtime-dependency-TEST
          sudo chmod -R go-w /usr/local/lib/subscription-runtime-dependency-TEST
      - name: Exercise real Linux TEST primitives
        env:
          TEST_SOURCE_SHA: ${{ github.sha }}
        run: |
          sudo env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            TEST_SOURCE_SHA="$TEST_SOURCE_SHA" \
            /usr/local/lib/subscription-runtime-dependency-TEST/toolchain/bin/node \
            --experimental-strip-types \
            /usr/local/lib/subscription-runtime-dependency-TEST/scripts/dependency-retention-test/run.node-test.ts
      - name: Retain bounded evidence
        if: always()
        run: |
          mkdir -p dependency-retention-evidence
          sudo test ! -f /usr/local/lib/subscription-runtime-dependency-TEST/evidence.json || \
            sudo cp /usr/local/lib/subscription-runtime-dependency-TEST/evidence.json dependency-retention-evidence/
          sudo chown -R "$(id -u):$(id -g)" dependency-retention-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-retention-native-test-${{ github.sha }}
          path: dependency-retention-evidence
          if-no-files-found: error

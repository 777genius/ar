# Secret-scan gate for the public mirror. No repository secrets are required.
name: Gitleaks

on:
  pull_request:
  schedule:
    # Weekly, off-peak. Minute staggered per repo (QUANTATECH-450 rollout) so the
    # gated repos do not all hit the runner pool in the same minute.
    - cron: "44 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
